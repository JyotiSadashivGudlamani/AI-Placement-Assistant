version: '3.8'

services:
  # MongoDB Community Server for user data, chat sessions, and evaluations
  mongo:
    image: mongo:7.0
    container_name: placement_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - placement_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend (PyMuPDF, ChromaDB, Sentence Transformers, LangGraph)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: placement_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # CRITICAL: host.docker.internal connects container to Ollama on Windows host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL_NAME=llama3.2:3b
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=ai_placement_prep
      - JWT_SECRET_KEY=placement_prod_secret_key_889900_change_in_production
      - CHROMA_DB_DIR=/app/backend/chroma_db
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:80
    extra_hosts:
      # Maps host.docker.internal to the Windows host gateway inside Linux Docker
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent storage for ChromaDB vector embeddings and uploaded files
      - chroma_data:/app/backend/chroma_db
      - uploads_data:/app/backend/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - placement_network

  # React + Vite Frontend served through Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - placement_network

volumes:
  mongo_data:
    driver: local
  chroma_data:
    driver: local
  uploads_data:
    driver: local

networks:
  placement_network:
    driver: bridge
